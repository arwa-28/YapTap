<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="popup.css">
    <title>YapTap</title>
</head>
<body>
    <main class="popup">
        <img class="logo" src="../images/logo-stacked.svg" alt="YapTap" width="220">

        <p class="tagline">
            Screen recording made simple.<br>
            A good listener, just for you.
        </p>

        <button id="start-recording" class="btn-primary">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="currentColor"
                    stroke-width="2" stroke-linejoin="round"></path>
            </svg>
            Start Recording
        </button>
    </main>

    <script src="popup.js"></script>
</body>
</html>
