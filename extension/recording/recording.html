<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="recording.css">
    <title>YapTap</title>
</head>
<body>
    <main class="app">

        <header class="app-header">
            <img class="brand" src="../images/logo-full.svg" alt="YapTap" height="68">
        </header>

        <section class="recording-options" aria-label="Recording options">
            <label class="option">
                <svg class="option-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="2.5" y="3.5" width="19" height="13" rx="2.5"></rect>
                    <path d="M8 21h8M12 16.5V21"></path>
                </svg>
                <span>Record Screen</span>
                <input type="checkbox" id="record-screen" checked>
            </label>

            <label class="option">
                <svg class="option-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="2.5" width="6" height="11.5" rx="3"></rect>
                    <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M8.5 21.5h7"></path>
                </svg>
                <span>Record Microphone</span>
                <input type="checkbox" id="record-microphone">
            </label>
        </section>

        <div class="video-container">

            <video id="video" autoplay playsinline muted hidden></video>

            <div id="preview-placeholder">
                <svg
                    class="placeholder-icon"
                    width="92"
                    height="76"
                    viewBox="0 0 92 76"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <rect x="4" y="14" width="66" height="45" rx="7"></rect>
                    <path d="M27 71h20M37 59v12"></path>
                    <path d="M77 18l4-9M83 30l9-4M80 42l10 2" stroke-width="4.5"></path>
                </svg>

                <h3>Ready to record?</h3>
                <p>Your screen preview will appear here</p>
            </div>

        </div>

        <div class="recording-controls">
            <button id="start-recording" class="btn-primary">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="currentColor"
                        stroke-width="2" stroke-linejoin="round"></path>
                </svg>
                Start Recording
            </button>

            <button id="pause-recording" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"></rect>
                    <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"></rect>
                </svg>
                Pause Recording
            </button>

            <button id="stop-recording" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"></rect>
                </svg>
                Stop Recording
            </button>
        </div>

        <p id="status" role="status">Waiting for you to start…</p>

    </main>

    <script src="recording.js"></script>
</body>
</html>
